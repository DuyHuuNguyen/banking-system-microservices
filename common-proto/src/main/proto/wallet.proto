syntax = "proto3";

package com.example.auth;
option java_multiple_files = true;
option java_package = "com.example.server.grpc.wallet";
option java_outer_classname = "WalletProto";

message InternalWalletResponse{
  int64 id =1;
  int64 userId =2;
  string currency=3;
  double balance=4;
}
message InternalWalletRequest{
  int64 id=1;
}

service WalletService{
  rpc findWalletById(InternalWalletRequest) returns (InternalWalletResponse);
}